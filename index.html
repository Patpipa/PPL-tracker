<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>PLH Tracker — Production Labour Efficiency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#12151A; --panel:#1B1F26; --panel2:#20242C; --line:#2A2F38;
  --text:#E9ECF1; --muted:#8A93A3; --muted2:#5F6774;
  --blue:#4FA8FF; --blue-dim:#2B4A6B;
  --green:#38D98A; --green-dim:#1E4A38;
  --amber:#F2B84B; --amber-dim:#4A3B1E;
  --red:#FF6B5E; --red-dim:#4A2420;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{padding-bottom:78px;min-height:100vh;}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
.field{margin-bottom:14px;}
.btn{border-radius:11px;padding:13px 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:transform .08s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#0A1420;}
.btn-primary2{background:transparent;border:1.5px solid var(--blue);color:var(--blue);}
.btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.btn-block{width:100%;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
.pill-good{background:var(--green-dim);color:var(--green);border-color:transparent;}
.pill-watch{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.pill-bad{background:var(--red-dim);color:var(--red);border-color:transparent;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(18,21,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 12px;}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
main{padding:16px;max-width:640px;margin:0 auto;}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(20,23,29,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;overflow-x:auto;}
.navitem{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 10px;color:var(--muted2);cursor:pointer;font-size:10.5px;font-weight:600;border:none;background:none;}
.navitem.active{color:var(--blue);}
.navitem svg{width:20px;height:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.hero-plh{background:linear-gradient(155deg,#1B2430,#171B21);border:1px solid var(--line);border-radius:18px;padding:22px 20px;text-align:center;margin-bottom:14px;}
.hero-plh .lbl{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.02em;}
.hero-plh .val{font-size:52px;font-weight:700;line-height:1;margin:8px 0 6px;color:var(--blue);}
.hero-plh .val span{font-size:20px;color:var(--muted);}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;}
.stat-card .l{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:4px;}
.stat-card .v{font-size:20px;font-weight:700;}
h2.sec{font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--text);}
h2.sec:first-child{margin-top:0;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;}
.emp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.emp-btn{padding:12px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer;}
.emp-btn.active{background:var(--blue);border-color:var(--blue);color:#0A1420;}
.modal-bg{position:fixed;inset:0;background:rgba(8,10,13,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 16px 26px;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted2);}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.dt-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.warn-box{background:var(--amber-dim);border:1px solid #6B5527;color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
::-webkit-scrollbar{height:0;width:0;}
@media print{
  .navbar,.topbar,.no-print{display:none!important;}
  body{background:#fff;color:#111;padding:0;}
  .card,.stat-card{border-color:#ccc;background:#fff;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ STORAGE ============ */
const K = { products:'plh_products', runs:'plh_runs', machines:'plh_machines', settings:'plh_settings' };
let state = { products:[], runs:[], machines:[], settings:{}, view:'dashboard', ready:false,
  dashRange:'today', logFilters:{range:'last7', machine:'all', product:'all'},
  perfTab:'product', perfProduct:null, perfMachine:null, compareIds:[],
  quickDraft:null, editingRun:null, modal:null, toastMsg:null, storageOk:true };

function defaultSettings(){
  return { companyName:'', shiftLength:8, defaultBreak:30, plhMethod:'gross',
    watchPct:5, attentionPct:10,
    downtimeCategories:['Waiting for meat/product','Waiting for packaging materials','Waiting for warehouse','Waiting for labels','Machine breakdown','Machine adjustment','Changeover','Product change','QA hold','QA inspection','Pre-op','Cleaning','Maintenance','Rework','No work available','Employee shortage','Other'],
    productCategories:['Steak','Burger Patties','Ground','Diced','Pork','Beef','Bison','Venison','Other'],
    seeded:false };
}

async function storeGet(key){
  try{ const r = await window.storage.get(key,false); return r?r.value:null; }
  catch(e){ return null; }
}
async function storeSet(key,val){
  try{ await window.storage.set(key,val,false); state.storageOk=true; return true; }
  catch(e){ state.storageOk=false; console.error('storage fail',e); return false; }
}
async function loadAll(){
  const [p,r,m,s] = await Promise.all([storeGet(K.products),storeGet(K.runs),storeGet(K.machines),storeGet(K.settings)]);
  state.products = p ? JSON.parse(p) : [];
  state.runs = r ? JSON.parse(r) : [];
  state.machines = m ? JSON.parse(m) : [];
  state.settings = s ? JSON.parse(s) : defaultSettings();
  if(!state.machines.length){
    state.machines = [
      {id:uid(),name:'Machine 1',active:true},
      {id:uid(),name:'Machine 2',active:true},
      {id:uid(),name:'Machine 3',active:true},
      {id:uid(),name:'Manual/Other',active:true}
    ];
    await saveMachines();
  }
  if(!state.settings.seeded && !state.products.length && !state.runs.length){
    seedSampleData();
    state.settings.seeded = true;
    await Promise.all([saveProducts(),saveRuns(),saveSettings()]);
  }
}
async function saveProducts(){ return storeSet(K.products, JSON.stringify(state.products)); }
async function saveRuns(){ return storeSet(K.runs, JSON.stringify(state.runs)); }
async function saveMachines(){ return storeSet(K.machines, JSON.stringify(state.machines)); }
async function saveSettings(){ return storeSet(K.settings, JSON.stringify(state.settings)); }

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ SAMPLE DATA ============ */
function seedSampleData(){
  const cats = {ribeye:'Steak', grd:'Ground', diced:'Diced', pork:'Pork', bison:'Bison'};
  state.products = [
    {id:uid(),productId:'100001',productName:'Ribeye Steak',category:'Steak',targetPLH:225,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100002',productName:'Ground Beef 5lb',category:'Ground',targetPLH:300,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100003',productName:'Diced Beef 10lb',category:'Diced',targetPLH:210,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100004',productName:'Pork Chops',category:'Pork',targetPLH:195,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100005',productName:'Bison Burger Patties',category:'Burger Patties',targetPLH:180,unit:'lb',active:true,sample:true}
  ];
  const m = state.machines.length ? state.machines : [{id:uid(),name:'Machine 1'},{id:uid(),name:'Machine 2'},{id:uid(),name:'Machine 3'}];
  const runs = [];
  const today = new Date();
  for(let dayOffset=6; dayOffset>=0; dayOffset--){
    const d = new Date(today); d.setDate(d.getDate()-dayOffset);
    const dateStr = d.toISOString().slice(0,10);
    const numRuns = 2 + Math.floor(Math.random()*2);
    let hour = 7;
    for(let i=0;i<numRuns;i++){
      const prod = state.products[Math.floor(Math.random()*state.products.length)];
      const mach = m[i % m.length];
      const emp = 2 + Math.floor(Math.random()*3);
      const durHrs = 1.5 + Math.random()*2;
      const startH = hour, startM = Math.random()>0.5?30:0;
      let endTotal = startH*60+startM + durHrs*60;
      const endH = Math.floor(endTotal/60)%24, endM = Math.round(endTotal%60);
      hour = Math.ceil(endTotal/60)+ (Math.random()>0.6?1:0);
      const brk = [0,15,30][Math.floor(Math.random()*3)];
      const weight = Math.round((prod.targetPLH*(0.85+Math.random()*0.3)) * (durHrs - brk/60) * emp);
      const dt = [];
      if(Math.random()>0.55){
        const cat = state.settings.downtimeCategories ? state.settings.downtimeCategories[Math.floor(Math.random()*6)] : 'Waiting for meat/product';
        const dm = 10+Math.floor(Math.random()*25);
        const dsH = startH, dsM = Math.min(50,startM+5);
        let deTotal = dsH*60+dsM+dm;
        dt.push({id:uid(), start:pad2(dsH)+':'+pad2(dsM), end:pad2(Math.floor(deTotal/60)%24)+':'+pad2(deTotal%60), category: cat, notes:''});
      }
      runs.push({
        id:uid(), date:dateStr, productId:prod.productId, productName:prod.productName, category:prod.category,
        machine:mach.name, quantity: Math.round(weight/6), weightLbs: weight, employeeCount: emp,
        startTime: pad2(startH)+':'+pad2(startM), endTime: pad2(endH)+':'+pad2(endM), breakMinutes: brk,
        downtime: dt, notes:'', sample:true, createdAt: d.toISOString(), updatedAt: d.toISOString()
      });
    }
  }
  state.runs = runs;
}
function pad2(n){ return String(Math.max(0,Math.min(23,n))).padStart(2,'0'); }

/* ============ CALCULATIONS ============ */
function toMinutes(t){ if(!t) return null; const p=t.split(':'); if(p.length<2) return null; const h=Number(p[0]),m=Number(p[1]); if(isNaN(h)||isNaN(m)) return null; return h*60+m; }
function diffMinutes(start,end){ const s=toMinutes(start), e=toMinutes(end); if(s==null||e==null) return 0; let d=e-s; if(d<0) d+=1440; return d; }
function fmtHM(mins){ mins=Math.round(mins||0); const h=Math.floor(mins/60), m=mins%60; return h>0 ? (h+'h '+m+'m') : (m+'m'); }

function calcRun(run){
  const prodMin = diffMinutes(run.startTime, run.endTime);
  const workingMin = Math.max(0, prodMin - (Number(run.breakMinutes)||0));
  const downtimeMin = (run.downtime||[]).reduce((a,d)=>a+diffMinutes(d.start,d.end),0);
  const netProdMin = Math.max(0, workingMin - downtimeMin);
  const emp = Number(run.employeeCount)||0;
  const weight = Number(run.weightLbs)||0;
  const grossLabourHours = (workingMin/60) * emp;
  const netLabourHours = (netProdMin/60) * emp;
  const grossPLH = grossLabourHours>0 ? weight/grossLabourHours : 0;
  const netPLH = netLabourHours>0 ? weight/netLabourHours : 0;
  return { prodMin, workingMin, downtimeMin, netProdMin, grossLabourHours, netLabourHours, grossPLH, netPLH, weight, emp };
}
function activePLH(run){ const c=calcRun(run); return state.settings.plhMethod==='net' ? c.netPLH : c.grossPLH; }
function activeLabourHours(run){ const c=calcRun(run); return state.settings.plhMethod==='net' ? c.netLabourHours : c.grossLabourHours; }

function targetFor(productId){ const p=state.products.find(x=>x.productId===productId); return p ? Number(p.targetPLH)||0 : 0; }
function statusVs(target, plh){
  if(!target) return {label:'No target', cls:'', pct:null};
  const diff = plh-target, pct = (diff/target)*100;
  const watch = state.settings.watchPct||5, bad = state.settings.attentionPct||10;
  let cls='pill-good', label='Above target';
  if(pct < -bad){ cls='pill-bad'; label='Needs attention'; }
  else if(pct < -watch){ cls='pill-watch'; label='Watch'; }
  else if(pct < 0){ cls='pill-watch'; label='Near target'; }
  return {label, cls, pct, diff};
}
function fmt1(n){ return (Math.round((n||0)*10)/10).toFixed(1); }
function fmt0(n){ return Math.round(n||0).toLocaleString(); }

function runsInRange(range, custom){
  const now = new Date(); const todayStr = now.toISOString().slice(0,10);
  const d = (offset)=>{ const x=new Date(now); x.setDate(x.getDate()-offset); return x.toISOString().slice(0,10); };
  let from, to = todayStr;
  if(range==='today'){ from=todayStr; }
  else if(range==='yesterday'){ from=d(1); to=d(1); }
  else if(range==='last7'){ from=d(6); }
  else if(range==='last30'){ from=d(29); }
  else if(range==='thisWeek'){ const dow=(now.getDay()+6)%7; from=d(dow); }
  else if(range==='thisMonth'){ from = todayStr.slice(0,8)+'01'; }
  else if(range==='custom' && custom){ from=custom.from; to=custom.to; }
  else { from='0000-01-01'; to='9999-12-31'; }
  return state.runs.filter(r=>r.date>=from && r.date<=to);
}

/* ============ RENDER SHELL ============ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = topbarHtml() + '<main>' + viewHtml() + '</main>' + navbarHtml() + modalHtml() + toastHtml();
  bindGlobal();
}
function icon(name){
  const icons = {
    dash:'<path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/>',
    entry:'<path d="M12 5v14M5 12h14"/>',
    log:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    prod:'<path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>',
    perf:'<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>',
    rep:'<path d="M9 12h6M9 16h6M9 8h6M5 3h14v18H5z"/>',
    set:'<path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+icons[name]+'</svg>';
}
function topbarHtml(){
  const titles = {dashboard:'Dashboard', entry:'Quick Entry', log:'Production Log', products:'Products', performance:'Performance', reports:'Reports', settings:'Settings'};
  const subs = {dashboard:'Pounds per Labour Hour', entry:'Fast floor entry', log:'Every production run', products:'Product master list', performance:'Trends & comparisons', reports:'Shift & management reports', settings:'Configuration'};
  return '<div class="topbar"><h1>'+titles[state.view]+'</h1><div class="sub">'+subs[state.view]+(state.storageOk?'':' · <span style="color:var(--red)">storage unavailable — changes may not save</span>')+'</div></div>';
}
function navbarHtml(){
  const items = [['dashboard','dash','Dashboard'],['entry','entry','Entry'],['log','log','Log'],['products','prod','Products'],['performance','perf','Perform'],['reports','rep','Reports'],['settings','set','Settings']];
  return '<div class="navbar">'+items.map(([v,i,l])=>
    '<button class="navitem '+(state.view===v?'active':'')+'" onclick="goTo(\''+v+'\')">'+icon(i)+'<span>'+l+'</span></button>'
  ).join('')+'</div>';
}
function toastHtml(){ return state.toastMsg ? '<div class="toast">'+state.toastMsg+'</div>' : ''; }
function toast(msg){ state.toastMsg=msg; render(); setTimeout(()=>{ state.toastMsg=null; render(); },1800); }
function goTo(v){ state.view=v; state.modal=null; render(); window.scrollTo(0,0); }
window.goTo = goTo;

function viewHtml(){
  switch(state.view){
    case 'dashboard': return dashboardView();
    case 'entry': return entryView();
    case 'log': return logView();
    case 'products': return productsView();
    case 'performance': return performanceView();
    case 'reports': return reportsView();
    case 'settings': return settingsView();
    default: return '';
  }
}

/* ============ DASHBOARD ============ */
function dashboardView(){
  const runs = runsInRange(state.dashRange);
  const totalLbs = runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
  const totalQty = runs.reduce((a,r)=>a+(Number(r.quantity)||0),0);
  const totalLabour = runs.reduce((a,r)=>a+activeLabourHours(r),0);
  const overallPLH = totalLabour>0 ? totalLbs/totalLabour : 0;
  const totalDowntime = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
  const avgEmp = runs.length ? (runs.reduce((a,r)=>a+(Number(r.employeeCount)||0),0)/runs.length) : 0;
  const avgTarget = (()=>{ const withT = runs.filter(r=>targetFor(r.productId)>0); if(!withT.length) return null;
    return withT.reduce((a,r)=>a+targetFor(r.productId),0)/withT.length; })();
  const variance = avgTarget ? overallPLH-avgTarget : null;

  let best=null, worst=null;
  runs.forEach(r=>{ const plh=activePLH(r); if(!best||plh>activePLH(best)) best=r; if(!worst||plh<activePLH(worst)) worst=r; });

  const byMachine = {};
  runs.forEach(r=>{ if(!byMachine[r.machine]) byMachine[r.machine]={lbs:0,hrs:0}; byMachine[r.machine].lbs+=Number(r.weightLbs)||0; byMachine[r.machine].hrs+=activeLabourHours(r); });

  const ranges = [['today','Today'],['yesterday','Yesterday'],['last7','7 days'],['last30','30 days'],['thisWeek','This week'],['thisMonth','This month']];

  return `
  <div class="tabs no-print">${ranges.map(([v,l])=>`<div class="chip ${state.dashRange===v?'active':''}" onclick="setDashRange('${v}')">${l}</div>`).join('')}</div>

  <div class="hero-plh">
    <div class="lbl">OVERALL PLH (${state.settings.plhMethod==='net'?'Net':'Gross'})</div>
    <div class="val">${fmt1(overallPLH)}<span> lbs/hr</span></div>
    ${avgTarget!=null ? statusLine(variance, avgTarget) : '<div style="color:var(--muted);font-size:12.5px;">No target data for this period</div>'}
  </div>

  <div class="grid2" style="margin-bottom:10px;">
    <div class="stat-card"><div class="l">TOTAL POUNDS</div><div class="v num">${fmt0(totalLbs)}</div></div>
    <div class="stat-card"><div class="l">LABOUR HOURS</div><div class="v num">${fmt1(totalLabour)}</div></div>
    <div class="stat-card"><div class="l">TOTAL QUANTITY</div><div class="v num">${fmt0(totalQty)}</div></div>

function statusLine(variance, target){
  const pct = (variance/target)*100;
  const good = variance>=0;
  const color = good ? 'var(--green)' : (Math.abs(pct)>(state.settings.attentionPct||10) ? 'var(--red)' : 'var(--amber)');
  return `<div style="color:${color};font-size:13px;font-weight:600;">${good?'+':''}${fmt1(variance)} PLH vs target (${fmt1(target)}) · ${good?'+':''}${fmt1(pct)}%</div>`;
}

let trendChartInstance=null;
function drawTrendChart(){
  const canvas = document.getElementById('trendChart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const data = days.map(day=>{
    const rs = state.runs.filter(r=>r.date===day);
    const lbs = rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
    const hrs = rs.reduce((a,r)=>a+activeLabourHours(r),0);
    return hrs>0 ? +(lbs/hrs).toFixed(1) : null;
  });
  if(trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(canvas,{
    type:'line',
    data:{ labels: days.map(d=>d.slice(5)), datasets:[{ data, borderColor:'#4FA8FF', backgroundColor:'rgba(79,168,255,.12)', fill:true, tension:.3, pointRadius:2, spanGaps:true }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ ticks:{color:'#8A93A3',font:{size:10}}, grid:{color:'#242830'}}, y:{ ticks:{color:'#8A93A3',font:{size:10}}, grid:{color:'#242830'}}}}
  });
}

  if(Number(d.quantity) < 0) errs.push('Quantity cannot be negative.');

function exportCSV(runs){
  const cols = ['Date','ProductID','ProductName','Machine','Quantity','Lbs','Employees','Start','End','Break','DowntimeMin','LabourHoursGross','LabourHoursNet','GrossPLH','NetPLH','TargetPLH','VariancePct','Notes'];
  const lines = [cols.join(',')];
  runs.forEach(r=>{
    const c=calcRun(r); const t=targetFor(r.productId); const st=statusVs(t,activePLH(r));
    const row = [r.date,r.productId,csvSafe(r.productName),csvSafe(r.machine),r.quantity,r.weightLbs,r.employeeCount,r.startTime,r.endTime,r.breakMinutes,
      c.downtimeMin,fmt1(c.grossLabourHours),fmt1(c.netLabourHours),fmt1(c.grossPLH),fmt1(c.netPLH),t||'',st.pct==null?'':fmt1(st.pct),csvSafe(r.notes||'')];
    lines.push(row.join(','));
  });
  downloadFile('plh_production_log_'+new Date().toISOString().slice(0,10)+'.csv', lines.join('\\n'), 'text/csv');
}
window.exportCSV=exportCSV;
function csvSafe(s){ s=String(s||''); return /[,"\\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadFile(filename, content, type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function productPerfView(){
  if(!state.perfProduct && state.products.length) state.perfProduct = state.products[0].productId;
  const runs = state.runs.filter(r=>r.productId===state.perfProduct);
  if(!runs.length) return `
    <select onchange="selectPerfProduct(this.value)">${state.products.map(p=>`<option value="${p.productId}" ${state.perfProduct===p.productId?'selected':''}>${p.productName}</option>`).join('')}</select>
    <div class="empty">No production runs recorded for this product yet.</div>`;
  const totalLbs = runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
  const totalQty = runs.reduce((a,r)=>a+(Number(r.quantity)||0),0);
  const totalLabour = runs.reduce((a,r)=>a+activeLabourHours(r),0);
  const avgPLH = totalLabour>0 ? totalLbs/totalLabour : 0;
  const plhs = runs.map(activePLH);
  const bestPLH = Math.max(...plhs), lowPLH = Math.min(...plhs);
  const target = targetFor(state.perfProduct);
  const st = statusVs(target, avgPLH);
  const avgEmp = runs.reduce((a,r)=>a+(Number(r.employeeCount)||0),0)/runs.length;
  const avgMin = runs.reduce((a,r)=>a+calcRun(r).workingMin,0)/runs.length;

function insightsView(){
  const byProduct = {};
  state.runs.forEach(r=>{ (byProduct[r.productId]=byProduct[r.productId]||[]).push(r); });
  const items = [];
  Object.entries(byProduct).forEach(([pid,runs])=>{
    if(runs.length<3) return;
    const p = state.products.find(x=>x.productId===pid);
    const lbs=runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=runs.reduce((a,r)=>a+activeLabourHours(r),0);
    const plh=hrs>0?lbs/hrs:0; const t=targetFor(pid);
    if(t){ const st=statusVs(t,plh); if(st.pct<-(state.settings.attentionPct||10)) items.push({type:'bad',text:`${p?p.productName:pid} is running ${fmt1(Math.abs(st.pct))}% below its target PLH across ${runs.length} runs.`}); }
    const dt = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
    const avgDT = dt/runs.length;
    if(avgDT>20) items.push({type:'watch',text:`${p?p.productName:pid} averages ${fmtHM(avgDT)} of downtime per run.`});
  });
  const byMachine={};
  state.runs.forEach(r=>{ (byMachine[r.machine]=byMachine[r.machine]||[]).push(r); });
  const machineStats = Object.entries(byMachine).filter(([m,rs])=>rs.length>=3).map(([m,rs])=>{
    const lbs=rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=rs.reduce((a,r)=>a+activeLabourHours(r),0);
    return {m, plh: hrs>0?lbs/hrs:0};
  }).sort((a,b)=>a.plh-b.plh);
  if(machineStats.length>=2) items.push({type:'watch',text:`${machineStats[0].m} has the lowest average PLH (${fmt1(machineStats[0].plh)}) among stations with sufficient data.`});

  return `
  <div class="card">
    ${items.length ? items.map(i=>`<div class="dt-item" style="border-left:3px solid ${i.type==='bad'?'var(--red)':'var(--amber)'};">${i.text}</div>`).join('') : '<div class="empty">Not enough data yet.</div>'}

}

function buildReportText(runs, label){
  const totalLbs = runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
  const totalQty = runs.reduce((a,r)=>a+(Number(r.quantity)||0),0);
  const totalLabour = runs.reduce((a,r)=>a+activeLabourHours(r),0);
  const overallPLH = totalLabour>0 ? totalLbs/totalLabour : 0;
  const totalDT = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
  const withT = runs.filter(r=>targetFor(r.productId)>0);
  const avgTarget = withT.length ? withT.reduce((a,r)=>a+targetFor(r.productId),0)/withT.length : null;
  const variance = avgTarget!=null ? overallPLH-avgTarget : null;
  const pct = variance!=null && avgTarget ? (variance/avgTarget)*100 : null;

  const byProduct={}; runs.forEach(r=>{ (byProduct[r.productId]=byProduct[r.productId]||[]).push(r); });
  const productAgg = Object.entries(byProduct).map(([pid,rs])=>{
    const lbs=rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=rs.reduce((a,r)=>a+activeLabourHours(r),0);
    const p=state.products.find(x=>x.productId===pid);
    return {name:p?p.productName:pid, plh: hrs>0?lbs/hrs:0};
  }).sort((a,b)=>b.plh-a.plh);
  const top3 = productAgg.slice(0,3), bottom3 = productAgg.slice(-3).reverse();

  const dtByCategory={};
  runs.forEach(r=>(r.downtime||[]).forEach(d=>{ const m=diffMinutes(d.start,d.end); dtByCategory[d.category||'Other']=(dtByCategory[d.category||'Other']||0)+m; }));
  const dtSorted = Object.entries(dtByCategory).sort((a,b)=>b[1]-a[1]);

  let text = `${label.toUpperCase()} REPORT\\n${new Date().toLocaleDateString()}\\n\\n`;
  text += `Total production: ${fmt0(totalLbs)} lbs\\nTotal quantity: ${fmt0(totalQty)}\\nTotal labour hours: ${fmt1(totalLabour)}\\nOverall PLH: ${fmt1(overallPLH)}\\n`;
  if(avgTarget!=null) text += `Target PLH: ${fmt1(avgTarget)}\\nVariance: ${variance>=0?'+':''}${fmt1(variance)} PLH (${pct>=0?'+':''}${fmt1(pct)}%)\\n`;
  text += `Total downtime: ${fmtHM(totalDT)}\\nProduction runs: ${runs.length}\\n\\n`;
  if(top3.length){ text += `TOP PERFORMING PRODUCTS\\n`; top3.forEach((p,i)=>text+=`${i+1}. ${p.name} — ${fmt1(p.plh)} PLH\\n`); text+='\\n'; }
  if(bottom3.length){ text += `LOWEST PERFORMING PRODUCTS\\n`; bottom3.forEach((p,i)=>text+=`${i+1}. ${p.name} — ${fmt1(p.plh)} PLH\\n`); text+='\\n'; }
  if(dtSorted.length){ text += `MAIN DOWNTIME REASONS\\n`; dtSorted.slice(0,5).forEach(([cat,m])=>text+=`${cat}: ${fmtHM(m)}\\n`); text+='\\n'; }
  text += `SUMMARY\\nProduction totaled ${fmt0(totalLbs)} lbs using ${fmt1(totalLabour)} labour hours, resulting in an overall PLH of ${fmt1(overallPLH)}.`;
  if(avgTarget!=null) text += ` Performance was ${pct>=0?fmt1(pct)+'% above':fmt1(Math.abs(pct))+'% below'} the target of ${fmt1(avgTarget)} PLH.`;
  if(dtSorted.length) text += ` The primary downtime cause was ${dtSorted[0][0].toLowerCase()}, accounting for ${fmtHM(dtSorted[0][1])}.`;
  return text;
}
function renderReportModal(){
  const runs = runsInRange(state._reportRange);
  const label = state._reportRange==='today'?'Daily':state._reportRange==='thisWeek'?'Weekly':'Monthly';

}

function restoreData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Restore will replace current data with the backup file. Continue?')) return;
      state.products = data.products||[]; state.runs = data.runs||[]; state.machines = data.machines||state.machines; state.settings = {...state.settings,...(data.settings||{})};
      await Promise.all([saveProducts(),saveRuns(),saveMachines(),saveSettings()]);
      render(); toast('Data restored');
    }catch(err){ alert('Could not read backup file: '+err.message); }
  };
  reader.readAsText(file);
}

  if(!confirm('This will permanently delete ALL products and production runs. Continue?')) return;

      <button class="btn btn-primary btn-block" onclick="confirmDowntime()">Add</button>
    </div>
  </div></div>`;
}
function confirmDowntime(){
  const d = state.modal.draft;
  if(!d.start || !d.end){ alert('Start and end time are required.'); return; }
  if(diffMinutes(d.start,d.end)<=0){ alert('End time must be after start time.'); return; }
  if(!state.quickDraft.downtime) state.quickDraft.downtime=[];
  state.quickDraft.downtime.push({id:uid(),...d});
  state.modal=null; render();
}
window.confirmDowntime=confirmDowntime;
function closeModal(){ state.modal=null; render(); }
window.closeModal=closeModal;

function productModal(){
  const d = state.modal.draft;
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">${d.id?'Edit':'Add'} product</h2>
    <div class="field"><label>Product ID</label><input value="${d.productId}" onchange="state.modal.draft.productId=this.value" ${d.id?'':''}></div>
    <div class="field"><label>Product name</label><input value="${d.productName}" onchange="state.modal.draft.productName=this.value"></div>
    <div class="field"><label>Description</label><input value="${d.description||''}" onchange="state.modal.draft.description=this.value"></div>
    <div class="field"><label>Category</label><select onchange="state.modal.draft.category=this.value">${state.settings.productCategories.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="grid2">
      <div class="field"><label>Target PLH</label><input type="number" value="${d.targetPLH}" onchange="state.modal.draft.targetPLH=Number(this.value)"></div>
      <div class="field"><label>Unit</label><input value="${d.unit||'lb'}" onchange="state.modal.draft.unit=this.value"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-block" onclick="saveProductModal()">Save</button>
    </div>
  </div></div>`;
}
function reportModal(){
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">${state.modal.label} report</h2>
    <div class="card" style="white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;max-height:50vh;overflow-y:auto;">${state.modal.text}</div>
    <div class="grid2" style="margin-top:12px;">
      <button class="btn btn-ghost" onclick="copyReportText()">Copy text</button>
      <button class="btn btn-ghost" onclick="window.print()">Print</button>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="exportReportPDF()">Export as PDF</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="closeModal()">Close</button>
  </div></div>`;
}

/* ============ BOOT ============ */
function bindGlobal(){
  if(state.view==='dashboard') setTimeout(drawTrendChart,30);
  if(state.view==='performance' && state.perfTab==='product') setTimeout(drawProductTrend,30);
}
(async function boot(){
  await loadAll();
  state.ready = true;
  render();
})();
</script>
</body>
</html>
