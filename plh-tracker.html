<style>
:root{
  color-scheme: dark;
  --bg:#12161D; --panel:#1D2330; --panel2:#242B3A; --line:#38424F;
  --text:#F1F4F9; --muted:#98A2B5; --muted2:#6B7484;
  --blue:#5CB6FF; --blue-dim:#284A6E;
  --green:#3CE698; --green-dim:#1B4F3B;
  --amber:#FFC24E; --amber-dim:#4F3C17;
  --red:#FF7466; --red-dim:#522521;
  --orange:#FF9E42; --orange-dim:#4A331A;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{padding-bottom:78px;min-height:100vh;}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;line-height:1.3;}
input[type="date"],input[type="time"]{min-height:46px;padding:10px 12px;display:block;color-scheme:dark;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
.field{margin-bottom:14px;}
.btn{border-radius:11px;padding:13px 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:transform .08s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#0A1420;}
.btn-orange{background:var(--orange);border-color:var(--orange);color:#2A1400;box-shadow:0 0 18px rgba(255,158,66,.28);}
.btn-primary2{background:transparent;border:1.5px solid var(--blue);color:var(--blue);}
.btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.btn-block{width:100%;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
.pill-good{background:var(--green-dim);color:var(--green);border-color:transparent;}
.pill-watch{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.pill-bad{background:var(--red-dim);color:var(--red);border-color:transparent;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(18,22,29,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 12px;box-shadow:0 1px 0 rgba(92,182,255,.08);}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
main{padding:16px;max-width:640px;margin:0 auto;}
.navbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(20,24,32,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;overflow-x:auto;}
.navitem{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px 10px;color:var(--muted2);cursor:pointer;font-size:10.5px;font-weight:600;border:none;background:none;}
.navitem.active{color:var(--blue);}
.navitem svg{width:20px;height:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.hero-plh{background:linear-gradient(155deg,#20304A,#181E2A);border:1px solid #33507A;border-radius:18px;padding:22px 20px;text-align:center;margin-bottom:14px;box-shadow:0 0 34px rgba(92,182,255,.14), inset 0 1px 0 rgba(255,255,255,.04);}
.hero-plh .lbl{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.02em;}
.hero-plh .val{font-size:52px;font-weight:700;line-height:1;margin:8px 0 6px;color:var(--blue);text-shadow:0 0 24px rgba(92,182,255,.35);}
.hero-plh .val span{font-size:20px;color:var(--muted);}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;}
.stat-card .l{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:4px;}
.stat-card .v{font-size:20px;font-weight:700;}
h2.sec{font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--text);}
h2.sec:first-child{margin-top:0;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;}
.emp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.emp-btn{padding:12px 0;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer;}
.emp-btn.active{background:var(--blue);border-color:var(--blue);color:#0A1420;box-shadow:0 0 14px rgba(92,182,255,.4);}
.modal-bg{position:fixed;inset:0;background:rgba(8,10,13,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 16px 26px;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted2);}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.dt-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.warn-box{background:var(--amber-dim);border:1px solid #6B5527;color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
::-webkit-scrollbar{height:0;width:0;}
@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; left:0; top:0; width:100%; padding:24px; display:block; }
  .navbar,.topbar,.no-print{display:none!important;}
  body{background:#fff;color:#111;padding:0;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" style="display:none;"></div>
<script>
/* ============ STORAGE ============ */
const K = { products:'plh_products', runs:'plh_runs', machines:'plh_machines', settings:'plh_settings', active:'plh_active_runs' };
let state = { products:[], runs:[], machines:[], settings:{}, activeRuns:{}, view:'dashboard', ready:false,
  dashRange:'today', logFilters:{range:'last7', machine:'all', product:'all'},
  perfTab:'product', perfProduct:null, perfMachine:null, compareIds:[],
  quickDraft:null, editingRun:null, modal:null, toastMsg:null, storageOk:true,
  unlocked:false, cloudStatus:'connecting' };

function defaultSettings(){
  return { companyName:'', shiftLength:8, defaultBreak:30, plhMethod:'gross',
    watchPct:5, attentionPct:10,
    downtimeCategories:['Waiting for meat/product','Waiting for packaging materials','Waiting for warehouse','Waiting for labels','Machine breakdown','Machine adjustment','Changeover','Product change','QA hold','QA inspection','Pre-op','Cleaning','Maintenance','Rework','No work available','Employee shortage','Other'],
    productCategories:['Steak','Burger Patties','Ground','Diced','Pork','Beef','Bison','Venison','Other'],
    seeded:false, pinHash:null };
}

/* ---- Firebase (cloud storage — this is now the source of truth) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyD0kpIsq2ewzZCIW7Cy8_OoYRd9ucfeT_M",
  authDomain: "plh-tracker.firebaseapp.com",
  projectId: "plh-tracker",
  storageBucket: "plh-tracker.firebasestorage.app",
  messagingSenderId: "652406697434",
  appId: "1:652406697434:web:115c8d1bfc2b0aba9164e3"
};
let fsDoc = null, fsReady = false;
async function initFirebase(){
  try{
    if(typeof firebase === 'undefined') throw new Error('Firebase SDK did not load');
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    fsDoc = firebase.firestore().collection('plh_tracker').doc('store');
    fsReady = true;
    state.cloudStatus = 'online';
  }catch(e){
    console.error('Firebase init failed, running on local storage only:', e);
    fsReady = false;
    state.cloudStatus = 'offline';
  }
}
async function fsSetField(field, value){
  if(!fsReady || !fsDoc) return false;
  try{
    await fsDoc.set({ [field]: value, updatedAt: new Date().toISOString() }, {merge:true});
    state.cloudStatus = 'online';
    return true;
  }catch(e){
    console.error('Firestore write failed (will retry next save):', e);
    state.cloudStatus = 'offline';
    return false;
  }
}
async function fsGetAll(){
  if(!fsReady || !fsDoc) return null;
  try{
    const snap = await fsDoc.get();
    state.cloudStatus = 'online';
    return snap.exists ? snap.data() : null;
  }catch(e){
    console.error('Firestore read failed, falling back to local cache:', e);
    state.cloudStatus = 'offline';
    return null;
  }
}
// Live cross-device sync: any change written by ANY device shows up here
// automatically. `hasPendingWrites` tells us whether this snapshot is our
// own not-yet-confirmed write (already reflected in our state — skip it) or
// a confirmed change (from us or another device — apply it).
let unsubRealtime = null;
function startRealtimeSync(){
  if(!fsReady || !fsDoc || unsubRealtime) return;
  unsubRealtime = fsDoc.onSnapshot((snap)=>{
    if(snap.metadata.hasPendingWrites) return;
    if(!snap.exists) return;
    const data = snap.data();
    state.products = data.products || [];
    state.runs = data.runs || [];
    state.machines = data.machines || [];
    state.settings = data.settings || state.settings;
    state.activeRuns = data.activeRuns || {};
    state.cloudStatus = 'online';
    storeSet(K.products, JSON.stringify(state.products));
    storeSet(K.runs, JSON.stringify(state.runs));
    storeSet(K.machines, JSON.stringify(state.machines));
    storeSet(K.settings, JSON.stringify(state.settings));
    storeSet(K.active, JSON.stringify(state.activeRuns));
    if(state.ready && state.unlocked) render();
  }, (err)=>{ console.error('Realtime sync error:', err); state.cloudStatus='offline'; });
}

const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined');
async function storeGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ const r = await window.storage.get(key,false); return r?r.value:null; }
    catch(e){ /* not found or unavailable — fall through to localStorage */ }
  }
  try{ return localStorage.getItem(key); }
  catch(e){ return null; }
}
async function storeSet(key,val){
  let ok = false;
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key,val,false); ok = true; } catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key,val); ok = true; }
  catch(e){ /* localStorage blocked (private mode / full) */ }
  state.storageOk = ok;
  if(!ok) console.error('storage fail: could not persist', key);
  return ok;
}
async function loadAll(){
  const cloud = await fsGetAll();
  if(cloud){
    state.products = cloud.products || [];
    state.runs = cloud.runs || [];
    state.machines = cloud.machines || [];
    state.settings = cloud.settings || defaultSettings();
    state.activeRuns = cloud.activeRuns || {};
    // keep the local cache fresh so the app still works offline next time
    storeSet(K.products, JSON.stringify(state.products));
    storeSet(K.runs, JSON.stringify(state.runs));
    storeSet(K.machines, JSON.stringify(state.machines));
    storeSet(K.settings, JSON.stringify(state.settings));
    storeSet(K.active, JSON.stringify(state.activeRuns));
  } else {
    const [p,r,m,s,a] = await Promise.all([storeGet(K.products),storeGet(K.runs),storeGet(K.machines),storeGet(K.settings),storeGet(K.active)]);
    state.products = p ? JSON.parse(p) : [];
    state.runs = r ? JSON.parse(r) : [];
    state.machines = m ? JSON.parse(m) : [];
    state.settings = s ? JSON.parse(s) : defaultSettings();
    state.activeRuns = a ? JSON.parse(a) : {};
    // if we have local data but Firestore came back empty/unreachable, push it up once we can
    if(fsReady && (state.products.length || state.runs.length)){
      fsSetField('products', state.products); fsSetField('runs', state.runs);
      fsSetField('machines', state.machines); fsSetField('settings', state.settings);
      fsSetField('activeRuns', state.activeRuns);
    }
  }
  if(!state.machines.length){
    state.machines = [
      {id:uid(),name:'Machine 1',active:true},
      {id:uid(),name:'Machine 2',active:true},
      {id:uid(),name:'Machine 3',active:true},
      {id:uid(),name:'Manual/Other',active:true}
    ];
    await saveMachines();
  }
  if(!state.settings.seeded && !state.products.length && !state.runs.length){
    seedSampleData();
    state.settings.seeded = true;
    await Promise.all([saveProducts(),saveRuns(),saveSettings()]);
  }
}
// Every save writes to the local cache immediately (fast, works offline) and
// pushes to Firestore in the background (the real source of truth). If the
// Firestore write fails (offline), the local cache still has it, and it gets
// pushed up automatically next time loadAll() runs and finds fsReady.
async function saveProducts(){ storeSet(K.products, JSON.stringify(state.products)); return fsSetField('products', state.products); }
async function saveRuns(){ storeSet(K.runs, JSON.stringify(state.runs)); return fsSetField('runs', state.runs); }
async function saveMachines(){ storeSet(K.machines, JSON.stringify(state.machines)); return fsSetField('machines', state.machines); }
async function saveSettings(){ storeSet(K.settings, JSON.stringify(state.settings)); return fsSetField('settings', state.settings); }
async function saveActiveRuns(){ storeSet(K.active, JSON.stringify(state.activeRuns)); return fsSetField('activeRuns', state.activeRuns); }

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ TIMEZONE (BC / America-Vancouver) ============ */
// All "today" / date-only logic is anchored to Pacific time so entries
// made in the evening don't roll over to tomorrow's date.
function vanToday(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'America/Vancouver'});
}
function vanNowClock(){
  return new Date().toLocaleString('en-US',{timeZone:'America/Vancouver'});
}
function addDaysToDateStr(dateStr, days){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.toISOString().slice(0,10);
}
function dowOfDateStr(dateStr){
  return new Date(dateStr+'T00:00:00Z').getUTCDay();
}

/* ============ SAMPLE DATA ============ */
function seedSampleData(){
  state.products = [
    {id:uid(),productId:'100001',productName:'Ribeye Steak',category:'Steak',targetPLH:225,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100002',productName:'Ground Beef 5lb',category:'Ground',targetPLH:300,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100003',productName:'Diced Beef 10lb',category:'Diced',targetPLH:210,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100004',productName:'Pork Chops',category:'Pork',targetPLH:195,unit:'lb',active:true,sample:true},
    {id:uid(),productId:'100005',productName:'Bison Burger Patties',category:'Burger Patties',targetPLH:180,unit:'lb',active:true,sample:true}
  ];
  const m = state.machines.length ? state.machines : [{id:uid(),name:'Machine 1'},{id:uid(),name:'Machine 2'},{id:uid(),name:'Machine 3'}];
  const runs = [];
  const todaySeed = vanToday();
  for(let dayOffset=6; dayOffset>=0; dayOffset--){
    const dateStr = addDaysToDateStr(todaySeed, -dayOffset);
    const numRuns = 2 + Math.floor(Math.random()*2);
    let hour = 7;
    for(let i=0;i<numRuns;i++){
      const prod = state.products[Math.floor(Math.random()*state.products.length)];
      const mach = m[i % m.length];
      const emp = 2 + Math.floor(Math.random()*3);
      const durHrs = 1.5 + Math.random()*2;
      const startH = hour, startM = Math.random()>0.5?30:0;
      let endTotal = startH*60+startM + durHrs*60;
      const endH = Math.floor(endTotal/60)%24, endM = Math.round(endTotal%60);
      hour = Math.ceil(endTotal/60)+ (Math.random()>0.6?1:0);
      const brk = [0,15,30][Math.floor(Math.random()*3)];
      const weight = Math.round((prod.targetPLH*(0.85+Math.random()*0.3)) * (durHrs - brk/60) * emp);
      const dt = [];
      if(Math.random()>0.55){
        const cat = state.settings.downtimeCategories ? state.settings.downtimeCategories[Math.floor(Math.random()*6)] : 'Waiting for meat/product';
        const dm = 10+Math.floor(Math.random()*25);
        const dsH = startH, dsM = Math.min(50,startM+5);
        let deTotal = dsH*60+dsM+dm;
        dt.push({id:uid(), start:pad2(dsH)+':'+pad2(dsM), end:pad2(Math.floor(deTotal/60)%24)+':'+pad2(deTotal%60), category: cat, notes:''});
      }
      runs.push({
        id:uid(), date:dateStr, productId:prod.productId, productName:prod.productName, category:prod.category,
        machine:mach.name, quantity: Math.round(weight/6), weightLbs: weight, employeeCount: emp,
        startTime: pad2(startH)+':'+pad2(startM), endTime: pad2(endH)+':'+pad2(endM), breakMinutes: brk,
        downtime: dt, notes:'', sample:true, createdAt: dateStr+'T12:00:00', updatedAt: dateStr+'T12:00:00'
      });
    }
  }
  state.runs = runs;
}
function pad2(n){ return String(Math.max(0,Math.min(23,n))).padStart(2,'0'); }

/* ============ CALCULATIONS ============ */
function toMinutes(t){ if(!t) return null; const p=t.split(':'); if(p.length<2) return null; const h=Number(p[0]),m=Number(p[1]); if(isNaN(h)||isNaN(m)) return null; return h*60+m; }
function diffMinutes(start,end){ const s=toMinutes(start), e=toMinutes(end); if(s==null||e==null) return 0; let d=e-s; if(d<0) d+=1440; return d; }
function fmtHM(mins){ mins=Math.round(mins||0); const h=Math.floor(mins/60), m=mins%60; return h>0 ? (h+'h '+m+'m') : (m+'m'); }

function calcRun(run){
  if(run.segments && run.segments.length){
    // Segment-based calc: handles employee count changing mid-run (staff moved
    // between machines) by weighting labour hours per time segment, and nets
    // out any downtime that overlaps a segment's time window.
    const segs = run.segments.map(s=>({start:new Date(s.start).getTime(), end:new Date(s.end||s.start).getTime(), count:Number(s.count)||0}));
    const dts = (run.downtime||[]).map(dt=>({start:new Date(dt.start).getTime(), end:new Date(dt.end||dt.start).getTime()}));
    let workingMin=0, grossLabourHours=0, netLabourHours=0;
    segs.forEach(s=>{
      const durMin = Math.max(0,(s.end-s.start)/60000);
      workingMin += durMin;
      grossLabourHours += (durMin/60)*s.count;
      let overlap=0;
      dts.forEach(dt=>{ const ovS=Math.max(s.start,dt.start), ovE=Math.min(s.end,dt.end); if(ovE>ovS) overlap += (ovE-ovS)/60000; });
      netLabourHours += (Math.max(0,durMin-overlap)/60)*s.count;
    });
    const downtimeMin = dts.reduce((a,dt)=>a+Math.max(0,(dt.end-dt.start)/60000),0);
    const netProdMin = Math.max(0, workingMin-downtimeMin);
    const weight = Number(run.weightLbs)||0;
    const grossPLH = grossLabourHours>0 ? weight/grossLabourHours : 0;
    const netPLH = netLabourHours>0 ? weight/netLabourHours : 0;
    const emp = segs.length ? segs.reduce((a,s)=>a+s.count*(s.end-s.start),0) / Math.max(1,segs.reduce((a,s)=>a+(s.end-s.start),0)) : 0;
    return { prodMin:workingMin, workingMin, downtimeMin, netProdMin, grossLabourHours, netLabourHours, grossPLH, netPLH, weight, emp };
  }
  // Legacy flat format (single fixed employee count for the whole run)
  const prodMin = diffMinutes(run.startTime, run.endTime);
  const workingMin = Math.max(0, prodMin - (Number(run.breakMinutes)||0));
  const downtimeMin = (run.downtime||[]).reduce((a,d)=>a+diffMinutes(d.start,d.end),0);
  const netProdMin = Math.max(0, workingMin - downtimeMin);
  const emp = Number(run.employeeCount)||0;
  const weight = Number(run.weightLbs)||0;
  const grossLabourHours = (workingMin/60) * emp;
  const netLabourHours = (netProdMin/60) * emp;
  const grossPLH = grossLabourHours>0 ? weight/grossLabourHours : 0;
  const netPLH = netLabourHours>0 ? weight/netLabourHours : 0;
  return { prodMin, workingMin, downtimeMin, netProdMin, grossLabourHours, netLabourHours, grossPLH, netPLH, weight, emp };
}
function activePLH(run){ const c=calcRun(run); return state.settings.plhMethod==='net' ? c.netPLH : c.grossPLH; }
function activeLabourHours(run){ const c=calcRun(run); return state.settings.plhMethod==='net' ? c.netLabourHours : c.grossLabourHours; }

function targetFor(productId){ const p=state.products.find(x=>x.productId===productId); return p ? Number(p.targetPLH)||0 : 0; }
function statusVs(target, plh){
  if(!target) return {label:'No target', cls:'', pct:null};
  const diff = plh-target, pct = (diff/target)*100;
  const watch = state.settings.watchPct||5, bad = state.settings.attentionPct||10;
  let cls='pill-good', label='Above target';
  if(pct < -bad){ cls='pill-bad'; label='Needs attention'; }
  else if(pct < -watch){ cls='pill-watch'; label='Watch'; }
  else if(pct < 0){ cls='pill-watch'; label='Near target'; }
  return {label, cls, pct, diff};
}
function fmt1(n){ return (Math.round((n||0)*10)/10).toFixed(1); }
function fmt0(n){ return Math.round(n||0).toLocaleString(); }

function runsInRange(range, custom){
  const todayStr = vanToday();
  const d = (offset)=> addDaysToDateStr(todayStr, -offset);
  let from, to = todayStr;
  if(range==='today'){ from=todayStr; }
  else if(range==='yesterday'){ from=d(1); to=d(1); }
  else if(range==='last7'){ from=d(6); }
  else if(range==='last30'){ from=d(29); }
  else if(range==='thisWeek'){ const dow=(dowOfDateStr(todayStr)+6)%7; from=d(dow); }
  else if(range==='thisMonth'){ from = todayStr.slice(0,8)+'01'; }
  else if(range==='custom' && custom){ from=custom.from; to=custom.to; }
  else { from='0000-01-01'; to='9999-12-31'; }
  return state.runs.filter(r=>r.date>=from && r.date<=to);
}

  const totalLabour = runs.reduce((a,r)=>a+activeLabourHours(r),0);
  const overallPLH = totalLabour>0 ? totalLbs/totalLabour : 0;
  const totalGrossHours = runs.reduce((a,r)=>a+calcRun(r).grossLabourHours,0);
  const totalNetHours = runs.reduce((a,r)=>a+calcRun(r).netLabourHours,0);
  const grossPLH = totalGrossHours>0 ? totalLbs/totalGrossHours : 0;
  const netPLH = totalNetHours>0 ? totalLbs/totalNetHours : 0;
  const totalDowntime = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
  const avgEmp = runs.length ? (runs.reduce((a,r)=>a+(Number(r.employeeCount)||0),0)/runs.length) : 0;
  const avgTarget = (()=>{ const withT = runs.filter(r=>targetFor(r.productId)>0); if(!withT.length) return null;
    return withT.reduce((a,r)=>a+targetFor(r.productId),0)/withT.length; })();
  const variance = avgTarget ? overallPLH-avgTarget : null;

  let best=null, worst=null;
  runs.forEach(r=>{ const plh=activePLH(r); if(!best||plh>activePLH(best)) best=r; if(!worst||plh<activePLH(worst)) worst=r; });

  const byMachine = {};
  runs.forEach(r=>{ if(!byMachine[r.machine]) byMachine[r.machine]={lbs:0,hrs:0}; byMachine[r.machine].lbs+=Number(r.weightLbs)||0; byMachine[r.machine].hrs+=activeLabourHours(r); });

    <div style="display:flex;justify-content:center;align-items:flex-end;gap:26px;margin:10px 0 8px;">
      <div>
        <div class="num" style="font-size:36px;font-weight:700;color:var(--blue);line-height:1;">${fmt1(grossPLH)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em;">GROSS lbs/hr</div>
      </div>
      <div style="width:1px;height:40px;background:var(--line);"></div>
      <div>
        <div class="num" style="font-size:36px;font-weight:700;color:var(--text);line-height:1;">${fmt1(netPLH)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em;">NET lbs/hr</div>
      </div>
    </div>
    ${avgTarget!=null ? statusLine(variance, avgTarget) : '<div style="color:var(--muted);font-size:12.5px;">No target data for this period</div>'}
  </div>

  <div class="grid2" style="margin-bottom:10px;">
    <div class="stat-card"><div class="l">TOTAL POUNDS</div><div class="v num">${fmt0(totalLbs)}</div></div>
    <div class="stat-card"><div class="l">LABOUR HOURS</div><div class="v num">${fmt1(totalLabour)}</div></div>
    <div class="stat-card"><div class="l">TOTAL QUANTITY</div><div class="v num">${fmt0(totalQty)}</div></div>
    <div class="stat-card"><div class="l">DOWNTIME</div><div class="v num">${fmtHM(totalDowntime)}</div></div>
    <div class="stat-card"><div class="l">PRODUCTION RUNS</div><div class="v num">${runs.length}</div></div>
    <div class="stat-card"><div class="l">AVG EMPLOYEES</div><div class="v num">${fmt1(avgEmp)}</div></div>
  </div>

  <h2 class="sec">PLH trend</h2>
  <div class="card"><canvas id="trendChart" height="140"></canvas></div>

  <h2 class="sec">Performance summary</h2>
  <div class="grid2">
    <div class="stat-card"><div class="l">BEST PRODUCT</div><div class="v" style="font-size:14px;">${best?best.productName+' — '+fmt1(activePLH(best))+' PLH':'—'}</div></div>
    <div class="stat-card"><div class="l">LOWEST PRODUCT</div><div class="v" style="font-size:14px;">${worst?worst.productName+' — '+fmt1(activePLH(worst))+' PLH':'—'}</div></div>
  </div>

  <h2 class="sec">Station summary</h2>
  <div class="card">
    ${Object.keys(byMachine).length ? Object.entries(byMachine).map(([m,v])=>{
      const plh = v.hrs>0 ? v.lbs/v.hrs : 0;
      return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--line);"><span>${m}</span><span class="num" style="font-weight:700;color:var(--blue);">${fmt1(plh)} PLH</span></div>`;
    }).join('') : '<div class="empty">No runs recorded for this period.</div>'}
  </div>
  <div style="height:6px;"></div>
  `;
}
function statusLine(variance, target){
  const pct = (variance/target)*100;
  const good = variance>=0;
  const color = good ? 'var(--green)' : (Math.abs(pct)>(state.settings.attentionPct||10) ? 'var(--red)' : 'var(--amber)');
  return `<div style="color:${color};font-size:13px;font-weight:600;">${good?'+':''}${fmt1(variance)} PLH vs target (${fmt1(target)}) · ${good?'+':''}${fmt1(pct)}%</div>`;
}

let trendChartInstance=null;
function drawTrendChart(){
  const canvas = document.getElementById('trendChart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = [];
  const t0 = vanToday();
  for(let i=13;i>=0;i--){ days.push(addDaysToDateStr(t0,-i)); }
  const data = days.map(day=>{
    const rs = state.runs.filter(r=>r.date===day);
    const lbs = rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
    const hrs = rs.reduce((a,r)=>a+activeLabourHours(r),0);
    return hrs>0 ? +(lbs/hrs).toFixed(1) : null;
  });
  if(trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(canvas,{
    type:'line',
    data:{ labels: days.map(d=>d.slice(5)), datasets:[{ data, borderColor:'#4FA8FF', backgroundColor:'rgba(79,168,255,.12)', fill:true, tension:.3, pointRadius:2, spanGaps:true }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ ticks:{color:'#8A93A3',font:{size:10}}, grid:{color:'#242830'}}, y:{ ticks:{color:'#8A93A3',font:{size:10}}, grid:{color:'#242830'}}}}
  });
}

function nowISO(){ return new Date().toISOString(); }
function timeHHMM(iso){ return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Vancouver',hour:'2-digit',minute:'2-digit',hour12:false}); }
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }
function elapsedMinutesForRun(run){ const start=new Date(run.segments[0].start).getTime(); return (Date.now()-start)/60000; }
function closedCopy(run){
  const t = nowISO();
  return { ...run, segments: run.segments.map(s=>({...s,end:s.end||t})), downtime:(run.downtime||[]).map(d=>({...d,end:d.end||t})) };
}
const DOWNTIME_GROUPS = [
  ['Upstream / Product', ['Waiting for meat/product','Product change']],
  ['Materials / Warehouse', ['Waiting for packaging materials','Waiting for warehouse','Waiting for labels']],
  ['Machine / Equipment', ['Machine breakdown','Machine adjustment','Maintenance']],
  ['Labour / Operational', ['Employee shortage','No work available','Changeover']],
  ['Cleaning / Sanitation', ['Cleaning','Rework']],
  ['QA / Pre-Op', ['QA hold','QA inspection','Pre-op']],
];
function groupedDowntimeCategories(){
  const all = state.settings.downtimeCategories||[];
  const used = new Set();
  const groups = DOWNTIME_GROUPS.map(([label,items])=>{
    const present = items.filter(i=>all.includes(i));
    present.forEach(i=>used.add(i));
    return [label, present];
  }).filter(([l,items])=>items.length);
  const rest = all.filter(c=>!used.has(c));
  if(rest.length) groups.push(['Other', rest]);
  return groups;
}
function flatDowntimeCats(){ return groupedDowntimeCategories().flatMap(([_,items])=>items); }

    <h2 class="sec" style="margin-top:0;">Downtime — ${esc(d.machine)}</h2>
    ${groups.map(([label,items])=>`

function setLiveDowntimeCatByIndex(i){ state.modal.category = flatDowntimeCats()[i]; renderModal(); }
window.setLiveDowntimeCatByIndex=setLiveDowntimeCatByIndex;
function confirmLiveDowntime(){
  const d = state.modal;
  if(!d.category){ alert('Select a downtime reason.'); return; }
  const run = state.activeRuns[d.machine]; if(!run) return;
  run.downtime.push({ id:uid(), start:nowISO(), end:null, category:d.category, notes:d.notes||'' });

}
window.confirmLiveDowntime=confirmLiveDowntime;
function resumeFromDowntime(machineId){
  const m = state.machines.find(x=>x.id===machineId); if(!m) return;
  const run = state.activeRuns[m.name]; if(!run) return;
  const open = run.downtime.find(d=>!d.end);

  run.status='running';
  saveActiveRuns();
  render();
}
window.resumeFromDowntime=resumeFromDowntime;

function openFinishRun(machineId){

  const run = state.activeRuns[m.name]; if(!run) return;
  state.modal = { type:'finishRun', machine:m.name, productId:run.productId||'', productName:run.productName||'', category:run.category||'', quantity:run.quantity||'', weightLbs:run.weightLbs||'', notes:run.notes||'' };

window.openFinishRun=openFinishRun;
function finishRunModal(){
  const d = state.modal;
  const target = targetFor(d.productId);
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">Finish run — ${esc(d.machine)}</h2>
    <div class="field"><label>Product</label>

    <div class="grid2">

    </div>
    <div class="field"><label>Notes (optional)</label><textarea rows="2" oninput="state.modal.notes=this.value">${esc(d.notes||'')}</textarea></div>
    <button class="btn btn-orange btn-block" style="margin-top:6px;" onclick="confirmFinishRun()">✅ Save & Finish</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="closeModal()">Keep running</button>
  </div></div>`;

function confirmFinishRun(){
  const d = state.modal;
  const run = state.activeRuns[d.machine];
  if(!run){ state.modal=null; render(); return; }
  if(!d.productId){ alert('Select a product before finishing.'); return; }
  if(!(Number(d.weightLbs)>0)){ alert('Enter total weight produced (lbs).'); return; }
  if(Number(d.quantity)<0){ alert('Quantity cannot be negative.'); return; }
  const t = nowISO();
  const segs = run.segments.map(s=>({...s, end: s.end||t}));
  const dts = (run.downtime||[]).map(dt=>({...dt, end: dt.end||t}));
  const finalRun = {
    id: uid(), date: run.date, machine: run.machine,
    productId: d.productId, productName: d.productName, category: d.category,
    quantity: d.quantity, weightLbs: d.weightLbs,
    segments: segs, downtime: dts, notes: d.notes||'',
    createdAt: run.createdAt, updatedAt: t
  };
  const c = calcRun(finalRun);
  finalRun.employeeCount = Math.round(c.emp*10)/10;
  finalRun.startTime = timeHHMM(segs[0].start);
  finalRun.endTime = timeHHMM(segs[segs.length-1].end);
  finalRun.breakMinutes = 0;
  state.runs.push(finalRun);
  delete state.activeRuns[d.machine];
  Promise.all([saveRuns(), saveActiveRuns()]);
  const plh = activePLH(finalRun);
  state.modal = null;
  render();
  toast('Run saved — '+fmt1(plh)+' PLH');
}
window.confirmFinishRun=confirmFinishRun;
function cancelActiveRun(machineId){
  const m = state.machines.find(x=>x.id===machineId); if(!m) return;
  showConfirm('Discard this run? Nothing will be saved.', ()=>{
    delete state.activeRuns[m.name];
    saveActiveRuns();
    render();
  });
}
window.cancelActiveRun=cancelActiveRun;

function manualEntryModal(){

    <div class="field"><label>Total weight (lbs)</label><input type="number" min="0" inputmode="decimal" value="${d.weightLbs}" onchange="updDraft('weightLbs',this.value)" placeholder="e.g. 3600"></div>

    <div class="field"><label>End time</label><input type="time" value="${d.endTime}" onchange="updDraft('endTime',this.value)"></div>

      <div class="row-between"><strong style="font-size:13px;">${esc(dt.category||'Downtime')}</strong><span style="color:var(--red);cursor:pointer;font-size:12px;" onclick="removeDowntime(${i})">Remove</span></div>

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function productInfoLineInner(d){

function empGridInner(d){

  return empOptions.map(n=>`<div class="emp-btn ${Number(d.employeeCount)===n?'active':''}" onclick="updDraft('employeeCount',${n})">${n}</div>`).join('')
    + `<div class="emp-btn ${Number(d.employeeCount)>=8?'active':''}" onclick="promptCustomEmp()">8+</div>`;
}
function breakChipsInner(d){

function previewCardInner(c){
  return `
    <div><div style="color:var(--muted);font-size:11.5px;">GROSS PLH</div><div class="num" style="font-size:22px;font-weight:700;color:var(--blue);">${fmt1(c.grossPLH)}</div></div>
    <div><div style="color:var(--muted);font-size:11.5px;">NET PLH</div><div class="num" style="font-size:22px;font-weight:700;">${fmt1(c.netPLH)}</div></div>

    <div><div style="color:var(--muted);font-size:11.5px;">DOWNTIME</div><div class="num">${fmtHM(c.downtimeMin)}</div></div>

// Updates only the live-changing parts of the manual entry form (preview,
// warnings, employee/break button states) instead of re-rendering the whole
// modal — a full re-render mid-keystroke closes native iOS time/number
// pickers and can shift the layout underneath the modal.
function refreshEntryLive(){
  if(!state.modal || state.modal.type!=='manualEntry' || !state.quickDraft){ renderModal(); return; }
  const d = state.quickDraft;
  const c = calcRun(d);
  const pc = document.getElementById('previewCard'); if(pc) pc.innerHTML = previewCardInner(c);
  const wb = document.getElementById('entryWarnings'); if(wb) wb.innerHTML = entryWarnings(d,c).map(w=>`<div class="warn-box">${w}</div>`).join('');
  const eg = document.getElementById('empGrid'); if(eg) eg.innerHTML = empGridInner(d);
  const bc = document.getElementById('breakChips'); if(bc) bc.innerHTML = breakChipsInner(d);
}
function entryWarnings(d,c){
  const w=[];
  if(!d.employeeCount) w.push('No employees entered.');
  if(!d.startTime || !d.endTime) w.push('Start/end time is missing.');
  if(d.productId && !targetFor(d.productId)) w.push('This product has no target PLH set.');
  if(d.weightLbs){
    const hist = state.runs.filter(r=>r.productId===d.productId).map(r=>Number(r.weightLbs));
    if(hist.length>=3){
      const avg = hist.reduce((a,b)=>a+b,0)/hist.length;
      if(Number(d.weightLbs) > avg*2.5) w.push("Weight is unusually high compared to this product's history.");
      if(Number(d.weightLbs) < avg*0.3) w.push("Weight is unusually low compared to this product's history.");
    }
  }
  return w;
}
function updDraft(key,val){ state.quickDraft[key]=val; if(key==='machine') state._lastMachine=val; if(key==='employeeCount') state._lastEmp=val; refreshEntryLive(); }
window.updDraft=updDraft;
function setProductOnDraft(pid){
  state.quickDraft.productId = pid;
  const p = state.products.find(x=>x.productId===pid);
  if(p){ state.quickDraft.productName=p.productName; state.quickDraft.category=p.category; }
  else { state.quickDraft.productName=''; state.quickDraft.category=''; }
}
function pickProduct(pid){ setProductOnDraft(pid); renderModal(); }
window.pickProduct=pickProduct;
function promptCustomEmp(){ showPrompt('Number of employees:', state.quickDraft.employeeCount||8, (v)=>{ updDraft('employeeCount',v); }, 'number'); }

/* Product picker — a tappable list instead of a text datalist, since iOS
   Safari does not support <datalist> autocomplete at all. Nests over
   whichever modal opened it (_prev) and returns to it on selection. */
function openProductPicker(){ const prev=state.modal; state.modal = {type:'productPicker', search:'', _prev:prev}; renderModal(); }
window.openProductPicker=openProductPicker;
function productPickerListInner(search){
  const s=(search||'').toLowerCase();
  const list = state.products.filter(p=>p.active!==false && (!s || p.productId.toLowerCase().includes(s) || (p.productName||'').toLowerCase().includes(s)));
  if(!list.length) return '<div class="empty" style="padding:20px;">No matching products.</div>';
  return list.map(p=>`<div class="dt-item" style="cursor:pointer;" onclick="selectProductFromPicker('${p.productId}')">
      <div style="font-weight:700;">${esc(p.productName)}</div>
      <div style="color:var(--muted);font-size:12px;margin-top:2px;">ID ${esc(p.productId)}${p.category?' · '+esc(p.category):''}${p.targetPLH?' · Target '+fmt1(p.targetPLH)+' PLH':''}</div>
    </div>`).join('');
}
function filterProductPicker(v){
  state.modal.search=v;
  const el=document.getElementById('productPickerList'); if(el) el.innerHTML=productPickerListInner(v);
}
window.filterProductPicker=filterProductPicker;
function selectProductFromPicker(pid){
  const prev = state.modal._prev;
  const p = state.products.find(x=>x.productId===pid);
  if(prev && prev.type==='manualEntry'){ setProductOnDraft(pid); state.modal=prev; renderModal(); return; }
  if(prev){ prev.productId=pid; prev.productName=p?p.productName:''; prev.category=p?p.category:''; state.modal=prev; renderModal(); return; }
  state.modal=null; render();
}
window.selectProductFromPicker=selectProductFromPicker;
function openManualProductEntry(){
  const prev = state.modal._prev;
  showPrompt('Enter Product ID manually (for a product not yet in your Product Master):', '', (val)=>{
    val = String(val).trim();
    if(!val) return;
    if(prev && prev.type==='manualEntry'){ setProductOnDraft(val); }
    else if(prev){ prev.productId=val; prev.productName=''; prev.category=''; }
  }, 'text', prev);
}
window.openManualProductEntry=openManualProductEntry;
function addDowntime(){
  const prev = state.modal;
  state.modal = { type:'downtime', draft:{start:'',end:'',category:state.settings.downtimeCategories[0],notes:''}, _prev:prev };
  renderModal();
}
window.addDowntime=addDowntime;
function removeDowntime(i){ state.quickDraft.downtime.splice(i,1); renderModal(); }
window.removeDowntime=removeDowntime;
function duplicatePrevious(){
  if(!state.runs.length){ toast('No previous entry to duplicate'); return; }
  const last = state.runs[state.runs.length-1];
  state.quickDraft = { ...blankRun(), productId:last.productId, productName:last.productName, category:last.category,
    machine:last.machine, employeeCount:last.employeeCount, breakMinutes:last.breakMinutes };
  renderModal();
}
window.duplicatePrevious=duplicatePrevious;

function validateRun(d){
  const errs=[];
  if(!d.productId) errs.push('Product ID is required.');
  if(Number(d.weightLbs) < 0) errs.push('Weight cannot be negative.');
  if(Number(d.quantity) < 0) errs.push('Quantity cannot be negative.');
  if(!d.employeeCount || Number(d.employeeCount)<=0) errs.push('Employees must be at least 1.');
  if(d.startTime && d.endTime && diffMinutes(d.startTime,d.endTime)<=0) errs.push('End time must be after start time.');
  return errs;
}
async function saveDraft(addAnother){
  const d = state.quickDraft;
  const errs = validateRun(d);
  if(errs.length){ alert(errs.join('\n')); return; }
  const p = state.products.find(x=>x.productId===d.productId);
  if(p){ d.productName=p.productName; d.category=p.category; }
  d.updatedAt = new Date().toISOString();
  if(d.id){
    const idx = state.runs.findIndex(r=>r.id===d.id);
    if(idx>-1) state.runs[idx]=d;
  } else {
    d.id = uid(); d.createdAt = new Date().toISOString();
    state.runs.push(d);
  }
  await saveRuns();
  toast('Production run saved');
  state.editingRun = null;
  if(addAnother){ state.quickDraft = blankRun(); renderModal(); }
  else { state.quickDraft = null; state.modal=null; goTo('log'); }
}
window.saveDraft=saveDraft;

/* ============ PRODUCTION LOG ============ */
function logView(){
  const ranges = [['today','Today'],['yesterday','Yesterday'],['last7','7 days'],['last30','30 days'],['thisWeek','This week'],['thisMonth','This month'],['all','All time']];
  let runs = runsInRange(state.logFilters.range).slice();
  if(state.logFilters.machine!=='all') runs = runs.filter(r=>r.machine===state.logFilters.machine);
  if(state.logFilters.product!=='all') runs = runs.filter(r=>r.productId===state.logFilters.product);
  runs.sort((a,b)=> (b.date+b.startTime).localeCompare(a.date+a.startTime));

  return `
  <div class="tabs no-print">${ranges.map(([v,l])=>`<div class="chip ${state.logFilters.range===v?'active':''}" onclick="setLogFilter('range','${v}')">${l}</div>`).join('')}</div>
  <div class="grid2 no-print" style="margin-bottom:14px;">
    <select onchange="setLogFilter('machine',this.value)">
      <option value="all">All machines</option>
      ${state.machines.map(m=>`<option value="${m.name}" ${state.logFilters.machine===m.name?'selected':''}>${m.name}</option>`).join('')}
    </select>
    <select onchange="setLogFilter('product',this.value)">
      <option value="all">All products</option>
      ${state.products.map(p=>`<option value="${p.productId}" ${state.logFilters.product===p.productId?'selected':''}>${p.productName}</option>`).join('')}
    </select>
  </div>
  <div class="row-between no-print" style="margin-bottom:10px;">
    <span style="color:var(--muted);font-size:12.5px;">${runs.length} run${runs.length!==1?'s':''}</span>
    <button class="btn btn-ghost" style="padding:8px 12px;font-size:12.5px;" onclick="exportCSV(getFilteredLogRuns())">Export CSV</button>
  </div>
  ${runs.length ? `<div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Product</th><th>Machine</th><th>Qty</th><th>Lbs</th><th>Emp</th><th>Start</th><th>End</th><th>Brk</th><th>DT</th><th>Lbr Hrs</th><th>PLH</th><th>Target</th><th>Var%</th><th></th></tr></thead>
    <tbody>${runs.map(r=>{
      const c=calcRun(r); const plh=activePLH(r); const t=targetFor(r.productId); const st=statusVs(t,plh);
      return `<tr>
        <td>${r.date}</td><td style="color:var(--blue);cursor:pointer;text-decoration:underline;" onclick="openRunDetail('${r.id}')">${esc(r.productName||r.productId)}${r.sample?' <span class="badge">sample</span>':''}</td><td>${r.machine}</td>
        <td class="num">${fmt0(r.quantity)}</td><td class="num">${fmt0(r.weightLbs)}</td><td class="num">${r.employeeCount}</td>
        <td>${r.startTime||'—'}</td><td>${r.endTime||'—'}</td><td>${r.breakMinutes||0}</td><td>${fmtHM(c.downtimeMin)}</td>
        <td class="num">${fmt1(activeLabourHours(r))}</td><td class="num" style="color:var(--blue);font-weight:700;">${fmt1(plh)}</td>
        <td class="num">${t?fmt1(t):'—'}</td><td class="num ${st.pct<0?'':''}" style="color:${st.pct==null?'var(--muted)':st.pct>=0?'var(--green)':'var(--red)'};">${st.pct==null?'—':(st.pct>=0?'+':'')+fmt1(st.pct)+'%'}</td>
        <td><span style="color:var(--blue);cursor:pointer;font-size:12px;" onclick="editRun('${r.id}')">Edit</span> · <span style="color:var(--red);cursor:pointer;font-size:12px;" onclick="deleteRun('${r.id}')">Del</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>` : '<div class="empty">No production runs in this range.</div>'}
  `;
}
function getFilteredLogRuns(){
  let runs = runsInRange(state.logFilters.range).slice();
  if(state.logFilters.machine!=='all') runs = runs.filter(r=>r.machine===state.logFilters.machine);

function exportCSV(runs){
  const cols = ['Date','ProductID','ProductName','Machine','Quantity','Lbs','Employees','Start','End','Break','DowntimeMin','LabourHoursGross','LabourHoursNet','GrossPLH','NetPLH','TargetPLH','VariancePct','Notes'];
  const lines = [cols.join(',')];
  runs.forEach(r=>{
    const c=calcRun(r); const t=targetFor(r.productId); const st=statusVs(t,activePLH(r));
    const row = [r.date,r.productId,csvSafe(r.productName),csvSafe(r.machine),r.quantity,r.weightLbs,r.employeeCount,r.startTime,r.endTime,r.breakMinutes,
      c.downtimeMin,fmt1(c.grossLabourHours),fmt1(c.netLabourHours),fmt1(c.grossPLH),fmt1(c.netPLH),t||'',st.pct==null?'':fmt1(st.pct),csvSafe(r.notes||'')];
    lines.push(row.join(','));
  });
  downloadFile('plh_production_log_'+vanToday()+'.csv', lines.join('\n'), 'text/csv');
}
window.exportCSV=exportCSV;
function csvSafe(s){ s=String(s||''); return /[,"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadFile(filename, content, type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function insightsView(){
  const byProduct = {};
  state.runs.forEach(r=>{ (byProduct[r.productId]=byProduct[r.productId]||[]).push(r); });
  const items = [];
  Object.entries(byProduct).forEach(([pid,runs])=>{
    if(runs.length<3) return;
    const p = state.products.find(x=>x.productId===pid);
    const lbs=runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=runs.reduce((a,r)=>a+activeLabourHours(r),0);
    const plh=hrs>0?lbs/hrs:0; const t=targetFor(pid);
    if(t){ const st=statusVs(t,plh); if(st.pct<-(state.settings.attentionPct||10)) items.push({type:'bad',text:`${p?p.productName:pid} is running ${fmt1(Math.abs(st.pct))}% below its target PLH across ${runs.length} runs.`}); }
    const dt = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
    const avgDT = dt/runs.length;
    if(avgDT>20) items.push({type:'watch',text:`${p?p.productName:pid} averages ${fmtHM(avgDT)} of downtime per run.`});
  });
  const byMachine={};
  state.runs.forEach(r=>{ (byMachine[r.machine]=byMachine[r.machine]||[]).push(r); });
  const machineStats = Object.entries(byMachine).filter(([m,rs])=>rs.length>=3).map(([m,rs])=>{
    const lbs=rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=rs.reduce((a,r)=>a+activeLabourHours(r),0);
    return {m, plh: hrs>0?lbs/hrs:0};
  }).sort((a,b)=>a.plh-b.plh);
  if(machineStats.length>=2) items.push({type:'watch',text:`${machineStats[0].m} has the lowest average PLH (${fmt1(machineStats[0].plh)}) among stations with sufficient data.`});

  return `
  <div class="card">
    ${items.length ? items.map(i=>`<div class="dt-item" style="border-left:3px solid ${i.type==='bad'?'var(--red)':'var(--amber)'};">${i.text}</div>`).join('') : '<div class="empty">Not enough data yet.</div>'}
  </div>
  `;
}

function buildReportData(runs, label){
  const totalLbs = runs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0);
  const totalQty = runs.reduce((a,r)=>a+(Number(r.quantity)||0),0);
  const totalLabour = runs.reduce((a,r)=>a+activeLabourHours(r),0);
  const overallPLH = totalLabour>0 ? totalLbs/totalLabour : 0;
  const totalDT = runs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
  const withT = runs.filter(r=>targetFor(r.productId)>0);
  const avgTarget = withT.length ? withT.reduce((a,r)=>a+targetFor(r.productId),0)/withT.length : null;
  const variance = avgTarget!=null ? overallPLH-avgTarget : null;
  const pct = variance!=null && avgTarget ? (variance/avgTarget)*100 : null;

  const byProduct={}; runs.forEach(r=>{ (byProduct[r.productId]=byProduct[r.productId]||[]).push(r); });
  const productAgg = Object.entries(byProduct).map(([pid,rs])=>{
    const lbs=rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=rs.reduce((a,r)=>a+activeLabourHours(r),0);
    const p=state.products.find(x=>x.productId===pid);
    return {name:p?p.productName:pid, plh: hrs>0?lbs/hrs:0};
  }).sort((a,b)=>b.plh-a.plh);
  const top = productAgg.slice(0,3);
  const bottom = productAgg.slice(-3).reverse().filter(p=>!top.includes(p));

  const dtByCategory={};
  runs.forEach(r=>(r.downtime||[]).forEach(d=>{ const m=diffMinutes(d.start,d.end); dtByCategory[d.category||'Other']=(dtByCategory[d.category||'Other']||0)+m; }));
  const downtime = Object.entries(dtByCategory).map(([category,minutes])=>({category,minutes})).sort((a,b)=>b.minutes-a.minutes);

  const byMachineMap={}; runs.forEach(r=>{ (byMachineMap[r.machine||'Unassigned']=byMachineMap[r.machine||'Unassigned']||[]).push(r); });
  const knownOrder = state.machines.map(m=>m.name);
  const byMachine = Object.entries(byMachineMap).map(([machine,rs])=>{
    const lbs=rs.reduce((a,r)=>a+(Number(r.weightLbs)||0),0), hrs=rs.reduce((a,r)=>a+activeLabourHours(r),0);
    const dt=rs.reduce((a,r)=>a+calcRun(r).downtimeMin,0);
    return { machine, lbs, labourHours:hrs, plh: hrs>0?lbs/hrs:0, downtimeMin:dt, runCount:rs.length };
  }).sort((a,b)=>{
    const ia=knownOrder.indexOf(a.machine), ib=knownOrder.indexOf(b.machine);
    if(ia===-1 && ib===-1) return a.machine.localeCompare(b.machine);
    if(ia===-1) return 1; if(ib===-1) return -1;
    return ia-ib;
  });

  return { label, generatedAt: vanNowClock(), totalLbs, totalQty, totalLabour, overallPLH, avgTarget, variance, pct, totalDowntimeMin: totalDT, runCount: runs.length, top, bottom, downtime, byMachine };
}
function reportSummarySentence(d){
  let s = `Production totaled ${fmt0(d.totalLbs)} lbs using ${fmt1(d.totalLabour)} labour hours, resulting in an overall PLH of ${fmt1(d.overallPLH)}.`;
  if(d.avgTarget!=null) s += ` Performance was ${d.pct>=0?fmt1(d.pct)+'% above':fmt1(Math.abs(d.pct))+'% below'} the target of ${fmt1(d.avgTarget)} PLH.`;
  if(d.downtime.length) s += ` The primary downtime cause was ${d.downtime[0].category.toLowerCase()}, accounting for ${fmtHM(d.downtime[0].minutes)}.`;
  return s;
}
function reportDataToText(d){
  let text = `${d.label.toUpperCase()} REPORT\n${d.generatedAt} (Pacific time)\n\n`;
  text += `Total production: ${fmt0(d.totalLbs)} lbs\nTotal quantity: ${fmt0(d.totalQty)}\nTotal labour hours: ${fmt1(d.totalLabour)}\nOverall PLH: ${fmt1(d.overallPLH)}\n`;
  if(d.avgTarget!=null) text += `Target PLH: ${fmt1(d.avgTarget)}\nVariance: ${d.variance>=0?'+':''}${fmt1(d.variance)} PLH (${d.pct>=0?'+':''}${fmt1(d.pct)}%)\n`;
  text += `Total downtime: ${fmtHM(d.totalDowntimeMin)}\nProduction runs: ${d.runCount}\n\n`;
  if(d.byMachine.length>1){ text += `MACHINE BREAKDOWN\n`; d.byMachine.forEach(m=>text+=`${m.machine}: ${fmt1(m.plh)} PLH — ${fmt0(m.lbs)} lbs, ${fmt1(m.labourHours)} hrs, ${fmtHM(m.downtimeMin)} downtime, ${m.runCount} run${m.runCount!==1?'s':''}\n`); text+='\n'; }
  if(d.top.length){ text += `TOP PERFORMING PRODUCTS\n`; d.top.forEach((p,i)=>text+=`${i+1}. ${p.name} — ${fmt1(p.plh)} PLH\n`); text+='\n'; }
  if(d.bottom.length){ text += `LOWEST PERFORMING PRODUCTS\n`; d.bottom.forEach((p,i)=>text+=`${i+1}. ${p.name} — ${fmt1(p.plh)} PLH\n`); text+='\n'; }
  if(d.downtime.length){ text += `MAIN DOWNTIME REASONS\n`; d.downtime.slice(0,5).forEach(x=>text+=`${x.category}: ${fmtHM(x.minutes)}\n`); text+='\n'; }
  text += `SUMMARY\n${reportSummarySentence(d)}`;
  return text;
}

function exportReportPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const d = state.modal.data;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 14;
    let y = 20;
    function checkPage(need){ if(y+need > pageH-16){ doc.addPage(); y = 20; } }
    function heading(text){
      checkPage(14);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(224,138,44);
      doc.text(text.toUpperCase(), marginX, y);
      doc.setDrawColor(224,138,44); doc.setLineWidth(0.6);
      doc.line(marginX, y+2, pageW-marginX, y+2);
      y += 9;
      doc.setTextColor(20,20,20);
    }
    function row(label, value, color){
      checkPage(8);
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(70,70,70);
      doc.text(String(label), marginX, y);
      doc.setFont('helvetica','bold');
      doc.setTextColor(color?color[0]:20, color?color[1]:20, color?color[2]:20);
      doc.text(String(value), pageW-marginX, y, {align:'right'});
      y += 7;
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20,20,20);
    doc.text(((state.settings.companyName?state.settings.companyName+' — ':'')+d.label.toUpperCase()+' PLH REPORT'), marginX, y);
    y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(130,130,130);
    doc.text(d.generatedAt+' (Pacific time)', marginX, y);
    y += 5;
    doc.setDrawColor(220,220,220); doc.line(marginX, y, pageW-marginX, y);
    y += 10;

    heading('Production Summary');
    row('Total pounds produced', fmt0(d.totalLbs)+' lbs');
    row('Total quantity', fmt0(d.totalQty));
    row('Total labour hours', fmt1(d.totalLabour));
    row('Overall PLH', fmt1(d.overallPLH)+' lbs/hr', [42,111,220]);
    if(d.avgTarget!=null){
      row('Target PLH', fmt1(d.avgTarget));
      const good = d.variance>=0;
      row('Variance vs target', (good?'+':'')+fmt1(d.variance)+' PLH ('+(good?'+':'')+fmt1(d.pct)+'%)', good?[42,163,111]:[220,70,54]);
    }
    row('Total downtime', fmtHM(d.totalDowntimeMin));
    row('Production runs', d.runCount);
    y += 4;

    if(d.byMachine.length>1){
      heading('Machine Breakdown');
      d.byMachine.forEach(m=>{
        checkPage(8);
        doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(70,70,70);
        doc.text(m.machine, marginX, y);
        doc.setFont('helvetica','bold'); doc.setTextColor(42,111,220);
        doc.text(fmt1(m.plh)+' PLH', pageW-marginX, y, {align:'right'});
        y += 5;
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(140,140,140);
        doc.text(fmt0(m.lbs)+' lbs · '+fmt1(m.labourHours)+' hrs · '+fmtHM(m.downtimeMin)+' downtime · '+m.runCount+' run'+(m.runCount!==1?'s':''), marginX, y);
        y += 7;
      });
      y += 3;
    }

    if(d.top.length){
      heading('Top Performing Products');
      d.top.forEach((p,i)=> row((i+1)+'. '+p.name, fmt1(p.plh)+' PLH', [42,163,111]));
      y += 4;
    }
    if(d.bottom.length){
      heading('Lowest Performing Products');
      d.bottom.forEach((p,i)=> row((i+1)+'. '+p.name, fmt1(p.plh)+' PLH', [220,70,54]));
      y += 4;
    }
    if(d.downtime.length){
      heading('Downtime Reasons');
      const maxMin = Math.max(...d.downtime.map(x=>x.minutes),1);
      const barMaxW = pageW-marginX*2;
      d.downtime.slice(0,6).forEach(x=>{
        checkPage(12);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
        doc.text(x.category, marginX, y);
        doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
        doc.text(fmtHM(x.minutes), pageW-marginX, y, {align:'right'});
        y += 3;
        const w = Math.max(2,(x.minutes/maxMin)*barMaxW);
        doc.setDrawColor(230,230,230); doc.rect(marginX, y, barMaxW, 3);
        doc.setFillColor(224,138,44); doc.rect(marginX, y, w, 3, 'F');
        y += 9;
      });
      y += 2;
    }
    heading('Summary');
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(40,40,40);
    const lines = doc.splitTextToSize(reportSummarySentence(d), pageW-marginX*2);
    checkPage(lines.length*6);
    doc.text(lines, marginX, y);

    doc.save((d.label||'report').toLowerCase()+'_plh_report_'+vanToday()+'.pdf');
  }catch(e){ alert('PDF export failed: '+e.message); }
}

function renameMachine(id){

    const newName = String(newNameRaw).trim();
    if(!newName || newName===m.name) return;
    const oldName = m.name;
    m.name = newName;
    let runsTouched = 0;
    state.runs.forEach(r=>{ if(r.machine===oldName){ r.machine=newName; runsTouched++; } });
    if(state.activeRuns[oldName]){
      const activeRun = state.activeRuns[oldName];
      activeRun.machine = newName;
      state.activeRuns[newName] = activeRun;
      delete state.activeRuns[oldName];
    }
    if(state._lastMachine===oldName) state._lastMachine=newName;
    Promise.all([saveMachines(), saveRuns(), saveActiveRuns()]).then(()=>{
      render();
      toast('Renamed — updated '+runsTouched+' past run'+(runsTouched!==1?'s':''));
    });
  }, 'text');
}

function backupData(){
  const payload = { products:state.products, runs:state.runs, machines:state.machines, settings:state.settings, activeRuns:state.activeRuns, exportedAt:new Date().toISOString() };
  downloadFile('plh_tracker_backup_'+vanToday()+'.json', JSON.stringify(payload,null,2), 'application/json');
}
window.backupData=backupData;
function restoreData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      showConfirm('Restore will replace current data with the backup file. Continue?', async ()=>{
        state.products = data.products||[]; state.runs = data.runs||[]; state.machines = data.machines||state.machines;
        state.settings = {...state.settings,...(data.settings||{})}; state.activeRuns = data.activeRuns||{};
        await Promise.all([saveProducts(),saveRuns(),saveMachines(),saveSettings(),saveActiveRuns()]);
        render(); toast('Data restored');
      });
    }catch(err){ alert('Could not read backup file: '+err.message); }
  };
  reader.readAsText(file);
}
window.restoreData=restoreData;
function resetData(){
  showConfirm('This will permanently delete all production runs and in-progress machine runs. Your Product Master list, machines, and settings will be kept. Continue?', ()=>{
    showConfirm('Are you absolutely sure? This cannot be undone.', ()=>{
      state.runs=[]; state.activeRuns={};
      Promise.all([saveRuns(),saveActiveRuns()]).then(()=>{ render(); toast('Production history cleared'); });
    });
  });
}
window.resetData=resetData;

/* ============ MODALS ============ */
function modalHtml(){
  if(!state.modal) return '';
  switch(state.modal.type){
    case 'downtime': return downtimeModal();
    case 'product': return productModal();
    case 'report': return reportModal();
    case 'productPicker': return productPickerModal();
    case 'manualEntry': return manualEntryModal();
    case 'startRun': return startRunModal();
    case 'changeStaff': return changeStaffModal();
    case 'liveDowntime': return liveDowntimeModal();
    case 'finishRun': return finishRunModal();
    case 'confirmDialog': return confirmDialogModal();
    case 'promptGeneric': return promptGenericModal();
    case 'runDetail': return runDetailModal();
    default: return '';
  }
}
/* Custom confirm/prompt dialogs — replace window.confirm()/prompt(), which
   several embedded webviews (e.g. quick-preview panes) silently ignore or
   auto-reject, making Cancel/Delete/Reset actions appear to do nothing. */
function showConfirm(message, onYes){
  const prev = state.modal;
  state.modal = { type:'confirmDialog', message, onYes, _prev: prev };
  render();
}
window.showConfirm=showConfirm;
function confirmDialogModal(){
  return `<div class="modal-bg"><div class="modal">
    <div style="font-size:15px;line-height:1.5;margin-bottom:18px;">${esc(state.modal.message)}</div>
    <div class="grid2">
      <button class="btn btn-ghost" onclick="cancelConfirmDialog()">Cancel</button>
      <button class="btn" style="background:var(--red);border-color:var(--red);color:#2A0D0A;" onclick="runConfirmYes()">Confirm</button>
    </div>
  </div></div>`;
}
function cancelConfirmDialog(){
  state.modal = state.modal._prev || null;
  if(state.modal) renderModal(); else render();
}
window.cancelConfirmDialog=cancelConfirmDialog;
function runConfirmYes(){
  const d = state.modal;
  const prev = d._prev;
  state.modal = prev || null;
  if(d.onYes) d.onYes();
  if(state.modal) renderModal(); else render();
}
window.runConfirmYes=runConfirmYes;

function showPrompt(message, defaultVal, onOk, inputType, returnToOverride){
  const prev = returnToOverride!==undefined ? returnToOverride : state.modal;
  state.modal = { type:'promptGeneric', message, value: defaultVal==null?'':defaultVal, onOk, inputType: inputType||'text', _prev: prev };
  render();
}
window.showPrompt=showPrompt;
function promptGenericModal(){
  const d = state.modal;
  return `<div class="modal-bg"><div class="modal">
    <div style="font-size:15px;margin-bottom:12px;">${esc(d.message)}</div>
    <input id="genericPromptInput" type="${d.inputType==='number'?'number':'text'}" ${d.inputType==='number'?'inputmode="numeric"':''} value="${esc(d.value)}" autofocus>
    <div class="grid2" style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="cancelGenericPrompt()">Cancel</button>
      <button class="btn btn-orange" onclick="confirmGenericPrompt()">OK</button>
    </div>
  </div></div>`;
}
function cancelGenericPrompt(){
  state.modal = state.modal._prev || null;
  if(state.modal) renderModal(); else render();
}
window.cancelGenericPrompt=cancelGenericPrompt;
function confirmGenericPrompt(){
  const el = document.getElementById('genericPromptInput');
  const raw = el ? el.value : '';
  const d = state.modal;
  const prev = d._prev;
  const val = d.inputType==='number' ? Number(raw) : raw;
  const valid = d.inputType==='number' ? !isNaN(val) : true;
  state.modal = prev || null;
  if(valid && d.onOk) d.onOk(val);
  if(state.modal) renderModal(); else render();
}
window.confirmGenericPrompt=confirmGenericPrompt;
function productPickerModal(){
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">Select product</h2>
    <input id="productPickerSearch" placeholder="Search product ID or name…" oninput="filterProductPicker(this.value)" autofocus>
    <div style="height:10px;"></div>
    <div id="productPickerList" style="max-height:44vh;overflow-y:auto;">${productPickerListInner('')}</div>
    <div style="height:12px;"></div>
    <button class="btn btn-ghost btn-block" onclick="openManualProductEntry()">Can't find it? Enter Product ID manually</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
  </div></div>`;
}
function downtimeModal(){
  const d = state.modal.draft;
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">Add downtime</h2>
    <div class="grid2">
      <div class="field"><label>Start</label><input type="time" value="${d.start}" onchange="state.modal.draft.start=this.value"></div>
      <div class="field"><label>End</label><input type="time" value="${d.end}" onchange="state.modal.draft.end=this.value"></div>
    </div>
    <div class="field"><label>Reason</label><select onchange="state.modal.draft.category=this.value; renderModal()">${state.settings.downtimeCategories.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    ${d.category==='Other' ? `<div class="field"><label>Custom note</label><input value="${d.notes||''}" onchange="state.modal.draft.notes=this.value"></div>` : `<div class="field"><label>Notes (optional)</label><input value="${d.notes||''}" onchange="state.modal.draft.notes=this.value"></div>`}
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-block" onclick="confirmDowntime()">Add</button>
    </div>
  </div></div>`;
}
function confirmDowntime(){
  const d = state.modal.draft;
  if(!d.start || !d.end){ alert('Start and end time are required.'); return; }
  if(diffMinutes(d.start,d.end)<=0){ alert('End time must be after start time.'); return; }
  if(!state.quickDraft.downtime) state.quickDraft.downtime=[];
  state.quickDraft.downtime.push({id:uid(),...d});
  state.modal = state.modal._prev || null;
  if(state.modal) renderModal(); else render();
}
window.confirmDowntime=confirmDowntime;
function closeModal(){
  if(state.modal && state.modal._prev){ state.modal = state.modal._prev; renderModal(); }
  else { state.modal=null; render(); }
}
window.closeModal=closeModal;

function productModal(){
  const d = state.modal.draft;
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">${d.id?'Edit':'Add'} product</h2>
    <div class="field"><label>Product ID</label><input value="${d.productId}" onchange="state.modal.draft.productId=this.value" ${d.id?'':''}></div>
    <div class="field"><label>Product name</label><input value="${d.productName}" onchange="state.modal.draft.productName=this.value"></div>
    <div class="field"><label>Description</label><input value="${d.description||''}" onchange="state.modal.draft.description=this.value"></div>
    <div class="field"><label>Category</label><select onchange="state.modal.draft.category=this.value">${state.settings.productCategories.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="grid2">
      <div class="field"><label>Target PLH</label><input type="number" value="${d.targetPLH}" onchange="state.modal.draft.targetPLH=Number(this.value)"></div>
      <div class="field"><label>Unit</label><input value="${d.unit||'lb'}" onchange="state.modal.draft.unit=this.value"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-block" onclick="saveProductModal()">Save</button>
    </div>
  </div></div>`;
}
function reportModal(){
  return `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">
    <h2 class="sec" style="margin-top:0;">${state.modal.label} report</h2>
    <div class="card" style="white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;max-height:50vh;overflow-y:auto;">${state.modal.text}</div>
    <button class="btn btn-orange btn-block" style="margin-top:12px;" onclick="shareReport()">📤 Share report</button>
    <div class="grid2" style="margin-top:10px;">
      <button class="btn btn-ghost" onclick="copyReportText()">Copy text</button>
      <button class="btn btn-ghost" onclick="printReport()">Print</button>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="exportReportPDF()">Export as PDF</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="closeModal()">Close</button>
  </div></div>`;
}
function shareReport(){
  const title = (state.settings.companyName?state.settings.companyName+' — ':'')+(state.modal.label||'Production')+' PLH Report — '+vanToday();
  const text = state.modal.text;
  // Web Share API opens the native share sheet (Mail, Messages, Slack, etc.)
  // — works in a real browser tab; falls back to a mailto link if unavailable.
  if(navigator.share){
    navigator.share({title, text}).catch(()=>{ /* user cancelled, or share failed — leave it, no need to alert */ });
    return;
  }
  try{
    window.location.href = 'mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent(text);
  }catch(e){
    alert("Couldn't open sharing. Try Copy text and paste it into your email or messaging app instead.");
  }
}
window.shareReport=shareReport;

/* ============ BOOT ============ */
function bindGlobal(){
  if(state.view==='dashboard') setTimeout(drawTrendChart,30);
  if(state.view==='performance' && state.perfTab==='product') setTimeout(drawProductTrend,30);
}
// Ticks the live elapsed-time display on any running machine cards without
// doing a full re-render (which would interrupt anything the user is doing).
function tickLiveTimers(){
  if(state.view!=='entry' || state.modal) return;
  Object.keys(state.activeRuns).forEach(mname=>{
    const el = document.getElementById('timer-'+cssId(mname));
    if(el) el.textContent = fmtHM(elapsedMinutesForRun(state.activeRuns[mname]));
  });
}
setInterval(tickLiveTimers, 15000);

/* ============ PIN LOCK SCREEN ============ */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function renderLockScreen(mode){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;">
    <div style="font-size:40px;margin-bottom:10px;">🔒</div>
    <h1 style="font-size:19px;margin:0 0 6px;">${mode==='setup'?'Set up a PIN':'Enter PIN'}</h1>
    <div style="color:var(--muted);font-size:13px;margin-bottom:20px;text-align:center;max-width:280px;">
      ${mode==='setup' ? "Choose a 4\u20136 digit PIN to protect this app. You'll need it each time you open it." : 'Enter your PIN to unlock the PLH Tracker.'}
    </div>
    <input id="pinInput" type="tel" inputmode="numeric" maxlength="6" autofocus placeholder="••••" style="text-align:center;font-size:28px;letter-spacing:10px;max-width:200px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;">
    ${mode==='setup' ? `<input id="pinInput2" type="tel" inputmode="numeric" maxlength="6" placeholder="Confirm PIN" style="text-align:center;font-size:18px;letter-spacing:6px;max-width:200px;margin-bottom:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;">` : '<div style="height:10px;"></div>'}
    <div id="pinError" style="color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:6px;"></div>
    <button class="btn btn-orange" style="width:100%;max-width:260px;" onclick="${mode==='setup'?'submitPinSetup()':'submitPinEntry()'}">${mode==='setup'?'Set PIN':'Unlock'}</button>
    ${mode==='setup' ? `<button class="btn btn-ghost" style="width:100%;max-width:260px;margin-top:10px;" onclick="skipPinSetup()">Skip — don't use a PIN</button>` : ''}
  </div>`;
}
async function submitPinSetup(){
  const p1 = document.getElementById('pinInput').value.trim();
  const p2 = document.getElementById('pinInput2').value.trim();
  const err = document.getElementById('pinError');
  if(p1.length<4){ err.textContent='PIN must be at least 4 digits.'; return; }
  if(p1!==p2){ err.textContent="PINs don't match."; return; }
  state.settings.pinHash = await sha256Hex(p1);
  await saveSettings();
  sessionStorage.setItem('plh_unlocked','1');
  state.unlocked = true; state.ready = true;
  startRealtimeSync();
  render();
}
window.submitPinSetup=submitPinSetup;
async function skipPinSetup(){
  state.settings.pinHash = null;
  await saveSettings();
  sessionStorage.setItem('plh_unlocked','1');
  state.unlocked = true; state.ready = true;
  startRealtimeSync();
  render();
}
window.skipPinSetup=skipPinSetup;
async function submitPinEntry(){
  const p1 = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('pinError');
  const hash = await sha256Hex(p1);
  if(hash === state.settings.pinHash){
    sessionStorage.setItem('plh_unlocked','1');
    state.unlocked = true; state.ready = true;
    startRealtimeSync();
    render();
  } else {
    err.textContent = 'Incorrect PIN.';
    document.getElementById('pinInput').value='';
  }
}
window.submitPinEntry=submitPinEntry;
function lockApp(){ sessionStorage.removeItem('plh_unlocked'); state.unlocked=false; renderLockScreen('enter'); }
window.lockApp=lockApp;
function changePinFromSettings(){
  showPrompt('New PIN (4\u20136 digits):', '', (v)=>{
    v = String(v).trim();
    if(v.length<4){ alert('PIN must be at least 4 digits.'); return; }
    sha256Hex(v).then(h=>{ state.settings.pinHash=h; saveSettings(); toast('PIN updated'); });
  }, 'text');
}
window.changePinFromSettings=changePinFromSettings;
function removePinFromSettings(){
  showConfirm('Remove PIN protection? Anyone with the link will be able to open the app.', ()=>{
    state.settings.pinHash=null; saveSettings(); toast('PIN protection removed');
  });
}
window.removePinFromSettings=removePinFromSettings;

(async function boot(){
  await initFirebase();
  await loadAll();
  if(state.settings.pinHash){
    if(sessionStorage.getItem('plh_unlocked')==='1'){ state.unlocked=true; state.ready=true; startRealtimeSync(); render(); }
    else { renderLockScreen('enter'); }
  } else {
    renderLockScreen('setup');
  }
})();
</script>
